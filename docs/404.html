<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Storehouse Finance</title>
    <script type="text/javascript">
      // GitHub Pages SPA Index Redirect
      // This script takes the current URL and converts it into a query parameter
      // so that the main index.html can load the correct state.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1).join('/') + '/?p=' +
        l.pathname.slice(1).replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
