name: Automated Lead Scraper

on:
  schedule:
    # Runs at 08:00 UTC (4:00 AM EST) every Monday
    - cron: '0 8 * * 1'
  workflow_dispatch:
    # Allows you to trigger it manually from the GitHub website

jobs:
  scrape-leads:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Scraper Script
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          # You can change this search term in the future if you want to target other cities!
          node scripts/scrape_leads.js "Churches in Columbus Metro Area, OH"
